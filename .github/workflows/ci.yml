name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -c "import ast; ast.parse(open('server.py').read()); print('server.py: OK')"
          python -c "import ast; ast.parse(open('logging_layer.py').read()); print('logging_layer.py: OK')"

      - name: Import smoke test
        # Catches ModuleNotFoundError and import-time crashes that bash -n can't.
        run: |
          python -c "from server import app; print('import: OK', app.title, app.version)"
          python -c "from logging_layer import RequestRecord, log_event, get_log_summary; print('logging_layer import: OK')"

      - name: Check for unreferenced constants
        # Catches the SSE_BUFFER_CAP-class bug (constant defined, never used).
        run: |
          python -c "
          import ast, sys
          with open('server.py') as f:
              tree = ast.parse(f.read())
          defined = {n.id for node in ast.walk(tree) if isinstance(node, ast.Assign)
                     for n in node.targets if isinstance(n, ast.Name)}
          used = {n.id for node in ast.walk(tree) if isinstance(node, ast.Name)}
          # Constants that are intentionally config-only (exported via / endpoint)
          config_exported = {'MAX_CONCURRENT','QUEUE_TIMEOUT','MAX_MESSAGES','MAX_CONTENT_CHARS'}
          unused = defined - used - config_exported
          # Filter out dunder/module-level conventions
          unused = {c for c in unused if not c.startswith('_') and c.isupper()}
          if unused:
              print(f'WARNING: possibly unused constants: {sorted(unused)}', file=sys.stderr)
          else:
              print('No unused constants detected')
          "

      - name: Bash syntax check
        run: bash -n hy3.sh && echo "hy3.sh: OK"

      - name: Shellcheck hy3.sh (optional, non-blocking)
        run: shellcheck hy3.sh || true
        continue-on-error: true

  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t hy3-openai-api-ci .
