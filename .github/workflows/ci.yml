name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -c "import ast; ast.parse(open('server.py').read()); print('server.py: OK')"
          python -c "import ast; ast.parse(open('logging_layer.py').read()); print('logging_layer.py: OK')"

      - name: Import smoke test
        # Catches ModuleNotFoundError and import-time crashes that bash -n can't.
        run: |
          python -c "from server import app; print('import: OK', app.title, app.version)"
          python -c "from logging_layer import RequestRecord, log_event, get_log_summary; print('logging_layer import: OK')"

      - name: Check for unreferenced constants
        # Catches the SSE_BUFFER_CAP-class bug (constant defined, never used).
        #
        # IMPORTANT: `used` MUST be restricted to ast.Load contexts. An assignment
        # target is itself an ast.Name node, so an unfiltered `used` set always
        # contains every name in `defined` — making `defined - used` permanently
        # empty and the whole check a silent no-op.
        run: |
          python - <<'PY'
          import ast, sys

          def unused_constants(path):
              with open(path) as f:
                  tree = ast.parse(f.read())
              defined = {
                  n.id
                  for node in ast.walk(tree)
                  if isinstance(node, ast.Assign)
                  for n in node.targets
                  if isinstance(n, ast.Name)
              }
              # Only Load contexts count as a real reference.
              used = {
                  n.id
                  for n in ast.walk(tree)
                  if isinstance(n, ast.Name) and isinstance(n.ctx, ast.Load)
              }
              unused = defined - used
              # Only care about module-level SCREAMING_SNAKE constants.
              return {c for c in unused if not c.startswith('_') and c.isupper()}

          for path in ('server.py', 'logging_layer.py'):
              leftover = unused_constants(path)
              if leftover:
                  print(f'WARNING: {path}: possibly unused constants: {sorted(leftover)}', file=sys.stderr)
              else:
                  print(f'{path}: no unused constants detected')
          # Warn only — do not fail the build on a heuristic.
          sys.exit(0)
          PY

      - name: Bash syntax check
        run: bash -n hy3.sh && echo "hy3.sh: OK"

      - name: Shellcheck hy3.sh (optional, non-blocking)
        run: shellcheck hy3.sh || true
        continue-on-error: true

  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t hy3-openai-api-ci .
