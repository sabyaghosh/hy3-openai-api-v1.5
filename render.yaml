# Render Blueprint — deploys hy3-openai-api as a web service
# Docs: https://render.com/docs/blueprint-spec
# After pushing this repo to GitHub, go to:
#   New > Blueprint > select this repo
# Render will read this file and create the service automatically.

services:
  - type: web
    name: hy3-openai-api
    runtime: docker
    plan: free
    region: oregon  # change to your nearest region (e.g. frankfurt, singapore, ohio)
    dockerfilePath: ./Dockerfile
    # v1.5.1 (#23): use /ready (not /health) for the Render health check.
    # /health is now a pure liveness signal (always 200 while process is alive);
    # /ready returns 503 during upstream outages so Render can route traffic
    # away from this instance without restarting it.
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "8000"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Concurrency control — fail fast with 503 instead of timing out at the gateway
      - key: MAX_CONCURRENT
        value: "10"
      - key: QUEUE_TIMEOUT
        value: "5"
      # security — uncomment and set strong secrets before going live.
      # Without these, your instance is an open proxy with public admin endpoints.
      # - key: API_KEYS
      #   value: "change-me-to-a-long-random-string"
      # - key: ADMIN_TOKEN
      #   value: "change-me-to-a-different-long-random-string"
