# Render Blueprint — deploys hy3-openai-api as a web service
# Docs: https://render.com/docs/blueprint-spec
# After pushing this repo to GitHub, go to:
#   New > Blueprint > select this repo
# Render will read this file and create the service automatically.

services:
  - type: web
    name: hy3-openai-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"
      # Concurrency control — fail fast with 503 instead of timing out at the gateway
      - key: MAX_CONCURRENT
        value: "10"
      - key: QUEUE_TIMEOUT
        value: "5"
